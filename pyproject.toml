[project]
name = "voc-olist-rag"
version = "0.1.0"
description = "Voice of Customer com RAG sobre as avaliacoes de clientes da base publica de e-commerce da Olist"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bertopic>=0.17.4",
    "faiss-cpu>=1.16.0",
    "fastapi>=0.163.0",
    "gensim>=4.4.0",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
    "kagglehub>=1.0.3",
    "langchain>=1.5.0",
    "langchain-core>=1.8.0",
    "langchain-google-genai>=4.5.0",
    "langgraph>=1.2.22",
    "matplotlib>=3.11.2",
    "nltk>=3.10.4",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "sentence-transformers>=6.3.0",
    "spacy>=3.8.18",
    "streamlit>=1.67.0",
    "torch>=2.15.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "nbconvert>=7.17.2",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# torch sai do indice CPU do PyTorch: o projeto roda sem GPU e o pacote padrao do PyPI
# traz as bibliotecas CUDA, alguns GB que nunca seriam usados
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
